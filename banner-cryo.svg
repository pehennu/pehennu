<svg width="1200" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cryoBg" x1="0" y1="0" x2="1200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081220" />
      <stop offset="50%" stop-color="#132A4A" />
      <stop offset="100%" stop-color="#1E4875" />
    </linearGradient>

    <linearGradient id="iceText" x1="300" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E3FDFD" />
      <stop offset="50%" stop-color="#7AD7F0" />
      <stop offset="100%" stop-color="#CBF1F5" />
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect x="1" y="1" width="1198" height="198" rx="12" fill="url(#cryoBg)" stroke="#7AD7F0" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Cristais de Gelo Animados (Nativo SVG) -->
  <polygon points="140,45 148,60 140,75 132,60" fill="#7AD7F0" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.95;0.3" dur="4s" repeatCount="indefinite" />
  </polygon>

  <polygon points="240,130 245,140 240,150 235,140" fill="#E3FDFD" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20; 0,0" dur="5.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.5s" repeatCount="indefinite" />
  </polygon>

  <polygon points="1040,40 1050,58 1040,76 1030,58" fill="#7AD7F0" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-18; 0,0" dur="4.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.95;0.3" dur="4.8s" repeatCount="indefinite" />
  </polygon>

  <polygon points="940,135 946,147 940,159 934,147" fill="#A6E3E9" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-14; 0,0" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.25;0.9;0.25" dur="5s" repeatCount="indefinite" />
  </polygon>

  <polygon points="600,20 605,28 600,36 595,28" fill="#E3FDFD" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite" />
  </polygon>

  <!-- Linha Geométrica -->
  <line x1="320" y1="145" x2="880" y2="145" stroke="#7AD7F0" stroke-width="1" stroke-opacity="0.35" />

  <!-- Textos -->
  <text x="600" y="90" text-anchor="middle" fill="url(#iceText)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="3">
    PEDRO NUNES
  </text>

  <text x="600" y="126" text-anchor="middle" fill="#A6E3E9" font-family="Consolas, Monaco, monospace" font-size="16" letter-spacing="3">
    BACK-END DEVELOPER • DATA SCIENCE & AI
  </text>
</svg>
