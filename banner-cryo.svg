<svg width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Glacial Snezhnaya -->
    <linearGradient id="cryoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081220" />
      <stop offset="50%" stop-color="#132A4A" />
      <stop offset="100%" stop-color="#1E4875" />
    </linearGradient>

    <!-- Brilho Ciano Cryo -->
    <linearGradient id="iceText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E3FDFD" />
      <stop offset="50%" stop-color="#7AD7F0" />
      <stop offset="100%" stop-color="#CBF1F5" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-18px) rotate(45deg); opacity: 0.9; }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
      50% { transform: translateY(-25px) rotate(-45deg); opacity: 0.8; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .crystal-1 { animation: float1 5s ease-in-out infinite; transform-origin: center; }
    .crystal-2 { animation: float2 7s ease-in-out infinite; transform-origin: center; }
    .crystal-3 { animation: float1 6s ease-in-out infinite 1.5s; transform-origin: center; }
    .title {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 700;
      fill: url(#iceText);
      letter-spacing: 2px;
      animation: fadeIn 1.2s ease-out forwards;
    }
    .subtitle {
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      fill: #A6E3E9;
      letter-spacing: 3px;
      opacity: 0.9;
    }
  </style>

  <!-- Fundo -->
  <rect width="1200" height="200" rx="12" fill="url(#cryoBg)" stroke="#7AD7F0" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Cristais de Gelo Animados (Losangos Cryo) -->
  <polygon points="140,45 148,60 140,75 132,60" fill="#7AD7F0" class="crystal-1" filter="url(#glow)" />
  <polygon points="240,130 245,140 240,150 235,140" fill="#E3FDFD" class="crystal-2" />
  <polygon points="1040,40 1050,58 1040,76 1030,58" fill="#7AD7F0" class="crystal-2" filter="url(#glow)" />
  <polygon points="940,135 946,147 940,159 934,147" fill="#A6E3E9" class="crystal-3" />
  <polygon points="600,22 605,30 600,38 595,30" fill="#E3FDFD" class="crystal-1" />

  <!-- Linhas Geométricas Sutis -->
  <line x1="320" y1="145" x2="880" y2="145" stroke="#7AD7F0" stroke-width="1" stroke-opacity="0.3" />

  <!-- Texto Principal -->
  <text x="50%" y="88" text-anchor="middle" class="title" filter="url(#glow)">PEDRO NUNES</text>
  <text x="50%" y="124" text-anchor="middle" class="subtitle">BACK-END DEVELOPER • DATA SCIENCE & AI</text>
</svg>
