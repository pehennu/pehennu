name: Generate snake animation

on:
  # Executa a cada 12 horas no minuto 0 (00:00 e 12:00 UTC)
  schedule:
    - cron: "0 */12 * * *"

  # Permite rodar manualmente pela aba Actions do GitHub
  workflow_dispatch:

  # Executa ao fazer push na branch principal
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake.svg (Cryo Theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-cryo.svg?color_snake=7ad7f0&color_dots=122338,1d436b,2d6a9f,52a8d8,a6e3e9&dark_color_dots=122338,1d436b,2d6a9f,52a8d8,a6e3e9

      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
