name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark

      - name: Apply Cryo Theme Colors
        run: |
          sed -i -E \
            -e 's/#161b22/#0d1b2a/gi' \
            -e 's/#0e4429/#132a4a/gi' \
            -e 's/#006d32/#1e4875/gi' \
            -e 's/#26a641/#3b82c4/gi' \
            -e 's/#39d353/#7ad7f0/gi' \
            -e 's/#2cbe4e/#7ad7f0/gi' \
            -e 's/:green;/: #7ad7f0;/gi' \
            -e 's/fill="green"/fill="#7ad7f0"/gi' \
            -e 's/purple/#e3fdfd/gi' \
            dist/snake-dark.svg

      - name: Push files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          clean: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
